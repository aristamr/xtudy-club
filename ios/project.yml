# Proyecto de Xcode generado con XcodeGen (https://github.com/yonaskolb/XcodeGen).
#   brew install xcodegen && cd ios && xcodegen
# El .xcodeproj no se versiona: este archivo es la fuente de verdad.
name: Presente
options:
  bundleIdPrefix: mx.xtudy
  developmentLanguage: es
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""          # Pon aquí tu Team ID (Xcode › Signing & Capabilities)
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: NO

packages:
  PresenteCore:
    path: Packages/PresenteCore

targets:
  Presente:
    type: application
    platform: iOS
    sources:
      - path: Presente
        excludes: ["Resources/Presente.storekit"]
      - path: Shared
      - path: Localization
    dependencies:
      - package: PresenteCore
        product: PresenteCore
      - target: PresenteMonitor
      - target: PresenteShield
    entitlements:
      path: Presente/Presente.entitlements
    info:
      path: Presente/Info.plist
      properties:
        CFBundleDisplayName: Presente
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: es
        CFBundleLocalizations: [es, en]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        LSApplicationQueriesSchemes: [instagram, youtube]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mx.xtudy.presente
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  PresenteMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: PresenteMonitor
      - path: Shared
    entitlements:
      path: PresenteMonitor/PresenteMonitor.entitlements
    info:
      path: PresenteMonitor/Info.plist
      properties:
        CFBundleDisplayName: Presente Monitor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PresenteMonitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mx.xtudy.presente.monitor

  PresenteShield:
    type: app-extension
    platform: iOS
    sources:
      - path: PresenteShield
      - path: Localization
    entitlements:
      path: PresenteShield/PresenteShield.entitlements
    info:
      path: PresenteShield/Info.plist
      properties:
        CFBundleDisplayName: Presente Shield
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mx.xtudy.presente.shield

  PresenteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PresenteTests
      - path: Presente/Resources/Presente.storekit
        buildPhase: resources
    dependencies:
      - target: Presente
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mx.xtudy.presente.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Presente:
    build:
      targets:
        Presente: all
        PresenteTests: [test]
    run:
      config: Debug
      storeKitConfiguration: Presente/Resources/Presente.storekit
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - PresenteTests
        - package: PresenteCore/PresenteCoreTests
    archive:
      config: Release
